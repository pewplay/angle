<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Angle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.png" type="image/png">
</head>

<body>
    <div class="top-spacer"></div>
  <div class="container">
    <h1 id="angle-title">
      <img src="favicon.png" alt="A" width="50">
      <span>NGLE</span>
    </h1>
    <div class="attempts-streak">
      <p>Attempts left: <span id="attempts-left">4</span></p>
      <p>Current streak: <span id="current-streak">0</span></p>
    </div>
    <canvas id="angle-canvas" width="400" height="400"></canvas>
    <div class="angle-display"></div>
    <div class="input-container">
      <label for="user-guess">Your guess (°): &nbsp;</label>
      <input type="number" id="user-guess" min="0" max="359" inputmode="numeric" />
      <button id="check-btn">Check</button>
    </div>
    <p id="result-message"></p>
    <button id="generate-btn">New Random Angle</button>
  </div>
  <script src="script.js"></script>
</body>

</html>
